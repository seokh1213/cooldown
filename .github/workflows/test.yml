name: Test

# update-static-data 는 master 에서만 돈다. 브랜치와 PR 은 여기서 먼저 검증한다.
# 자료 생성·배포는 하지 않고, 저장소에 들어 있는 public/data 그대로 시험한다.
on:
  pull_request:
  push:
    branches-ignore:
      - master

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check and lint
        run: |
          npm run type-check
          npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Data tests
        run: npm run test:data
