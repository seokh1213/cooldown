name: Test

# update-static-data 는 master 에서만 돈다. 브랜치와 PR 은 여기서 먼저 검증한다.
# 자료 생성·배포는 하지 않고, 저장소에 들어 있는 public/data 그대로 시험한다.
on:
  pull_request:
  push:
    branches-ignore:
      - master

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisor-quality:
    uses: ./.github/workflows/advisor-quality.yml

  test:
    needs: advisor-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Detect champion mechanics changes
        run: npm run llm:mechanics-drift

      - name: Type-check and lint
        run: |
          npm run type-check
          npm run lint

      - name: Unit tests
        env:
          NODE_OPTIONS: --test-reporter=dot
        run: npm run test:unit

      - name: Data tests
        env:
          NODE_OPTIONS: --test-reporter=dot
        run: npm run test:data

      - name: Check champion mechanics answer regressions
        run: npm run llm:mechanics-eval -- research/champion-mechanics/reports/answer-quality.json --check

      - name: Upload champion mechanics change report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: champion-mechanics-drift
          path: research/champion-mechanics/reports/*
          retention-days: 14
          if-no-files-found: ignore

  # master 에서는 update-static-data 가 같은 스모크를 돌린다. 화면을 바꾼 브랜치도 합치기 전에 본다.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build project
        run: npm run build

      - name: Prepare GitHub Pages artifact
        run: npm run prepare-pages

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Upload visual regression report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-report-${{ github.run_id }}
          path: playwright-report
          retention-days: 14
