name: Update Static Data

on:
  schedule:
    # 매시 17분 (UTC 기준).
    # 정각은 cron 이 가장 몰리는 분이라 GitHub 이 공유 러너 부하로 회차를 버린다.
    # 실제로 */30 을 걸어 둔 동안 하루 48회 중 6~8회만 실행됐다. 붐비지 않는 분으로 옮긴다.
    - cron: '17 * * * *'
  workflow_dispatch: # 수동 실행 가능
  push:
    branches:
      - master

permissions:
  contents: write
  # 지식 계층 점검 결과를 이슈로 남긴다. 이슈 알림이 곧 메일이다.
  issues: write
  # GitHub Pages 에 Actions 로 바로 배포한다(gh-pages 브랜치를 거치지 않는다).
  pages: write
  id-token: write

concurrency:
  group: update-static-data
  cancel-in-progress: false

jobs:
  # 먼저 값싸게 확인하고, 바뀐 게 없으면 여기서 끝낸다.
  # 예전에는 회차마다 173챔피언 × 3언어를 통째로 다시 받은 뒤에야 변경 여부를 봤다.
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout version marker
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            public/data/version.json
            scripts/ci
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Restore source outage start time
        uses: actions/cache/restore@v6
        with:
          path: research/.cache/source-health/static.json
          key: static-source-health-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: static-source-health-v1-

      - name: Check source availability and changes
        id: decide
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci/upstream-changed.mjs

      - name: Save source availability across retries
        if: always() && steps.decide.outputs.health_checked == 'true'
        uses: actions/cache/save@v6
        with:
          path: research/.cache/source-health/static.json
          key: static-source-health-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preserve source availability report
        if: always() && steps.decide.outputs.health_checked == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: static-source-health
          path: research/.cache/source-health/static.json*
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true

  update-data:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.pages-artifact.outcome == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # 대기 중 원천 갱신 커밋이 추가될 수 있으므로 실행 시점의 master를 배포한다.
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # 코드 배포는 검증할 저장소 자료를 사용한다. 원천 갱신은 스케줄과 수동 실행에서 수행한다.
      - name: Generate static data
        if: github.event_name != 'push'
        run: npm run generate-static-data

      - name: Generate and archive patch changes
        if: github.event_name != 'push'
        run: npm run generate-patch-notes -- --current

      # 새 패치로 넘어가면 생성기가 옛 패치의 도우미 자료(llm/)를 옮겨 둔다. 새 툴팁으로 카드·지식
      # 묶음·번역을 다시 짓고, 미리 쓴 상성 답은 재료가 그대로인 쌍만 남긴다. 옮긴 것이 없으면 그냥 끝난다.
      - name: Carry advisor data to the new patch
        if: github.event_name != 'push'
        run: npm run llm:carry

      - name: Refresh champion stat growth
        if: github.event_name != 'push'
        run: npm run llm:refresh-growth

      - name: Review combo compatibility
        run: npm run llm:prepare-release

      - name: Upload combo compatibility review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: combo-compatibility-review
          path: research/.cache/combo-review/report.*
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true

      # 자료가 새로 오면 아이콘 판본도 바뀐다. 목록 화면이 쓰는 축소 사본을 여기서
      # 같이 만든다. Data Dragon 에서 1,041장을 받아 96px/64px WebP 로 줄이는데
      # 10.2MB 가 1.9MB 가 된다. 지난 판본 폴더는 생성기가 지운다.
      - name: Generate thumbnails
        if: github.event_name != 'push'
        run: npm run generate-thumbnails

      # 아이템 능력치 줄에 붙일 스탯 글리프 표. 줄은 라이엇이 준 그 나라 말이라
      # 새 아이템이나 새 능력치가 오면 표도 함께 자라야 한다. 자료를 받은 뒤에 돈다.
      - name: Generate stat label icons
        if: github.event_name != 'push'
        run: npm run generate-stat-label-icons

      # 검증보다 **앞에** 둔다. 리워크가 오면 npm test 가 멈추는데, 그 뒤에 두면
      # 정작 무엇이 바뀌었는지 적어 둘 기회를 잃는다. 이 단계는 스스로 멈추지 않는다.
      - name: Report knowledge drift
        id: drift
        run: npm run llm:drift-report

      # 스킬 본문·수치·형태가 바뀐 슬롯만 재작성 대상으로 잡는다.
      # 모델 인증은 CI에 없으므로 준비한 입력과 재사용 후보를 artifact로 전달한다.
      - name: Detect champion mechanics changes
        id: mechanics-drift
        run: npm run llm:mechanics-drift

      - name: Prepare changed champion mechanics
        if: steps.mechanics-drift.outputs.has_changes == 'true'
        run: npm run llm:mechanics-refresh -- "$RUNNER_TEMP/mechanics-next"

      - name: Check champion mechanics answer regressions
        run: npm run llm:mechanics-eval -- research/champion-mechanics/reports/answer-quality.json --check

      - name: Upload champion mechanics update inputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: champion-mechanics-update
          path: |
            research/champion-mechanics/reports/*
            ${{ runner.temp }}/mechanics-next
          retention-days: 14
          if-no-files-found: ignore

      # 같은 보고서로 알림을 반복하지 않으며 새 본문 지문은 다시 알린다.
      - name: Open or update knowledge drift issue
        if: steps.drift.outputs.has_report == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/ci/knowledge-drift-issue.ts

      - name: Type-check and lint
        run: |
          npm run type-check
          npm run lint

      # 코드만 보는 시험. 새로 받은 자료와 무관하게 깨지면 코드 탓이다.
      # 1,200건을 한 줄씩 찍으면 로그가 그것으로 찬다. 점으로 찍고, 실패만 이름과 함께 보인다.
      - name: Unit tests
        env:
          NODE_OPTIONS: --test-reporter=dot
        run: npm run test:unit

      # 방금 만든 public/data 를 읽는 시험. 여기서만 깨지면 새 자료(패치·리워크)를 먼저 의심한다.
      - name: Data tests
        env:
          NODE_OPTIONS: --test-reporter=dot
        run: npm run test:data

      - name: Audit every official patch report
        run: npm run patch-notes:audit

      # `src/data/generated` 도 생성물이다. 시트에 무엇이 몇째 칸에 있는지를 적어 둔
      # 파일이라, 챔피언이나 아이템이 늘면 시트와 함께 바뀐다. 여기 안 넣으면 그림만
      # 새로 붙고 차례는 낡은 채로 나가 아이콘이 통째로 밀린다 — 화면은 조용하다.
      - name: Check for changes
        id: git-check
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all -- public/data public/img public/patch-notes data/patch-notes src/data/generated scripts/active-tooltip-allowlist.json)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated data locally
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/data/ public/img/ public/patch-notes/ data/patch-notes/ src/data/generated/ scripts/active-tooltip-allowlist.json
          git commit -m "chore: 정적 데이터와 패치 변경 기록 갱신 [skip ci]"

      - name: Build project
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        run: VITE_DEPLOYMENT_VERSION="$(git rev-parse --short=16 HEAD)" npm run build

      - name: Prepare GitHub Pages artifact
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        run: npm run prepare-pages

      - name: Verify deployment artifact
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        run: |
          test -f dist/.nojekyll
          test -f dist/404.html
          test -f dist/encyclopedia/index.html
          test -f dist/vs/index.html
          test -f dist/patch-notes/index.html
          diff --recursive --brief --exclude=index.html public/patch-notes dist/patch-notes
          test ! -d dist/patch-notes/sources
          test ! -d dist/patch-notes/snapshots
          test ! -d dist/patch-notes/reviews
          test ! -d dist/patch-notes/skill-catalogs
          test ! -d dist/patch-notes/icon-catalogs
          test ! -d dist/patch-notes/official
          # 빌드가 data/releases/<데이터 해시>/ 에 데이터 사본을 하나 더 만든다(PWA 릴리스 캐시).
          # 원본 트리와 그 사본이 각각 public/data 와 같아야 한다.
          diff --recursive --brief --exclude=releases public/data dist/data
          release_dir=$(find dist/data/releases -mindepth 1 -maxdepth 1 -type d)
          test "$(printf '%s\n' "$release_dir" | wc -l)" -eq 1
          diff --recursive --brief public/data "$release_dir"

      # 브라우저(약 170MB)는 Playwright 판본마다 같으므로 캐시한다. 시스템 라이브러리는 apt 라 매번 깐다.
      - name: Read Playwright version
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        if: (github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true') && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: (github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true') && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run browser smoke tests
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        run: npm run test:e2e -- --workers=2

      # 성공한 회차의 보고서는 볼 일이 없다. 실패했을 때만 남긴다.
      - name: Upload visual regression report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-report-${{ github.run_id }}
          path: playwright-report
          retention-days: 14

      # 작업 시간이 10분 가까이 걸려 그사이 master 가 움직일 수 있다.
      # 리베이스 없이 밀면 non-fast-forward 로 실패하고 데이터 갱신이 통째로 날아간다.
      - name: Push validated generated data
        if: steps.git-check.outputs.changed == 'true'
        run: |
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin master && git push && exit 0
            echo "push 재시도 ${attempt}"
            sleep $((attempt * 5))
          done
          exit 1

      # 예전에는 dist 를 gh-pages 브랜치에 커밋했다(peaceiris/actions-gh-pages). 그러면 옛 파일을
      # 하나씩 지우는 로그가 5천 줄 넘게 찍히고, 브랜치 기록이 배포마다 쌓이고(2,639 커밋·182MB),
      # 그 push 를 받아 GitHub 이 Pages 빌드를 한 번 더 돌렸다. 이제 산출물을 바로 올린다.
      # actions/upload-pages-artifact 와 같은 일(dist 를 tar 로 묶어 github-pages 로 올림)을 한다.
      # 그 action 은 tar -v 로 파일 5,800개 이름을 모두 찍어서 직접 묶는다.
      - name: Archive GitHub Pages artifact
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        run: tar --dereference --hard-dereference --directory dist -cf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        id: pages-artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  # 배포만 따로 둔다. environment 를 update-data 에 달면 배포하지 않는 매시 회차에도 배포 기록이 쌓인다.
  deploy:
    needs: update-data
    if: needs.update-data.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
