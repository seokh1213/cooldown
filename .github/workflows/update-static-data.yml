name: Update Static Data

on:
  schedule:
    # 매시 정각 (UTC 기준)
    - cron: '0 * * * *'
  workflow_dispatch: # 수동 실행 가능
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: update-static-data
  cancel-in-progress: false

jobs:
  # 먼저 값싸게 확인하고, 바뀐 게 없으면 여기서 끝낸다.
  # 예전에는 회차마다 173챔피언 × 3언어를 통째로 다시 받은 뒤에야 변경 여부를 봤다.
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout version marker
        uses: actions/checkout@v7
        with:
          sparse-checkout: public/data/version.json
          sparse-checkout-cone-mode: false

      - name: Decide whether to run
        id: decide
        run: |
          local_version="$(node -p "require('./public/data/version.json').sources.ddragon")"
          curl -sS --retry 3 https://ddragon.leagueoflegends.com/api/versions.json -o /tmp/versions.json
          remote_version="$(node -p "require('/tmp/versions.json')[0]")"
          echo "로컬 $local_version / 원격 $remote_version"

          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$remote_version" != "$local_version" ]]; then
            echo "패치가 바뀌었다."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$(date -u +%H)" == "00" ]]; then
            # 버전이 그대로여도 하루 한 번은 다시 만든다.
            # 배포 데이터에는 CDragon BIN 에서 나오는 부분(툴팁 현지화, 스킬 시뮬레이션)이
            # 있는데, CDragon 은 같은 버전에서도 추출이 개선되면 출력이 달라진다.
            echo "버전은 그대로지만 하루 한 번 회차다."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "패치 그대로. 이번 회차는 여기서 끝낸다."
          fi

  update-data:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate static data
        run: npm run generate-static-data

      - name: Validate project
        run: |
          npm run type-check
          npm run lint
          npm test

      - name: Check for changes
        id: git-check
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all -- public/data scripts/active-tooltip-allowlist.json)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated data locally
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/data/ scripts/active-tooltip-allowlist.json
          git commit -m "chore: update static data [skip ci]"

      - name: Build project
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        run: VITE_DEPLOYMENT_VERSION="$(git rev-parse --short=16 HEAD)" npm run build

      - name: Prepare GitHub Pages artifact
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        run: npm run prepare-pages

      - name: Verify deployment artifact
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        run: |
          test -f dist/.nojekyll
          test -f dist/404.html
          test -f dist/encyclopedia/index.html
          test -f dist/simulation/index.html
          diff --recursive --brief public/data dist/data

      - name: Install Playwright browser
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        run: npm run test:e2e

      - name: Upload visual regression report
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-report-${{ github.run_id }}
          path: playwright-report
          retention-days: 14

      # 작업 시간이 10분 가까이 걸려 그사이 master 가 움직일 수 있다.
      # 리베이스 없이 밀면 non-fast-forward 로 실패하고 데이터 갱신이 통째로 날아간다.
      - name: Push validated generated data
        if: steps.git-check.outputs.changed == 'true'
        run: |
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin master && git push && exit 0
            echo "push 재시도 ${attempt}"
            sleep $((attempt * 5))
          done
          exit 1

      - name: Deploy to GitHub Pages
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
