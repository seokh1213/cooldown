name: Update Static Data

on:
  schedule:
    # 30분마다 실행 (UTC 기준)
    - cron: '*/30 * * * *'
  workflow_dispatch: # 수동 실행 가능
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: update-static-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate static data
        run: npm run generate-static-data

      - name: Validate project
        run: |
          npm run type-check
          npm run lint
          npm test

      - name: Check for changes
        id: git-check
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all -- public/data)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated data locally
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/data/
          git commit -m "chore: update static data [skip ci]"

      - name: Build project
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        run: VITE_DEPLOYMENT_VERSION="$(git rev-parse --short=16 HEAD)" npm run build

      - name: Prepare GitHub Pages artifact
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        run: npm run prepare-pages

      - name: Verify deployment artifact
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        run: |
          test -f dist/.nojekyll
          test -f dist/404.html
          test -f dist/encyclopedia/index.html
          test -f dist/simulation/index.html
          diff --recursive --brief public/data dist/data

      - name: Install Playwright browser
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        run: npm run test:e2e

      - name: Upload visual regression report
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report-${{ github.run_id }}
          path: playwright-report
          retention-days: 14

      - name: Push validated generated data
        if: steps.git-check.outputs.changed == 'true'
        run: git push

      - name: Deploy to GitHub Pages
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
