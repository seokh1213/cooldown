name: Update Static Data

on:
  schedule:
    # 매시 정각 (UTC 기준)
    - cron: '0 * * * *'
  workflow_dispatch: # 수동 실행 가능
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: update-static-data
  cancel-in-progress: false

jobs:
  # 먼저 값싸게 확인하고, 바뀐 게 없으면 여기서 끝낸다.
  # 예전에는 회차마다 173챔피언 × 3언어를 통째로 다시 받은 뒤에야 변경 여부를 봤다.
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Checkout version marker
        uses: actions/checkout@v7
        with:
          sparse-checkout: public/data/version.json
          sparse-checkout-cone-mode: false

      - name: Decide whether to run
        id: decide
        run: |
          local_version="$(node -p "require('./public/data/version.json').sources.ddragon")"
          curl -sS --retry 3 https://ddragon.leagueoflegends.com/api/versions.json -o /tmp/versions.json
          remote_version="$(node -p "require('/tmp/versions.json')[0]")"
          echo "로컬 $local_version / 원격 $remote_version"

          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual" >> "$GITHUB_OUTPUT"
          elif [[ "$remote_version" != "$local_version" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=patch" >> "$GITHUB_OUTPUT"
          elif [[ "$(date -u +%H)" == "00" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=stats" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=unchanged" >> "$GITHUB_OUTPUT"
            echo "패치 그대로. 이번 회차는 여기서 끝낸다."
          fi

  update-data:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Read current patch
        id: before
        run: echo "patch=$(node -p "require('./public/data/version.json').patchVersion")" >> "$GITHUB_OUTPUT"

      # 통계만 새로 받는 회차에는 챔피언 데이터를 다시 만들지 않는다.
      # 다시 만들면 173챔피언 × 3언어를 전부 새로 쓰는데, 게임이 그대로여도
      # 원본 표기가 달라져 있으면 그 차이가 그대로 커밋된다. CDragon 이 BIN 해시를
      # 점점 사람이 읽을 이름으로 풀어내는 것이 그런 예다("{30412ba3}" → "HealthCostCalc",
      # 둘은 fnv1a32 로 같은 필드다). 통계 갱신에는 챔피언 데이터가 필요 없다.
      - name: Generate static data
        if: needs.check.outputs.reason != 'stats'
        run: npm run generate-static-data

      - name: Detect patch change
        id: patch
        run: |
          after="$(node -p "require('./public/data/version.json').patchVersion")"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          if [[ "$after" != "${{ steps.before.outputs.patch }}" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # generate-static-data 는 이전 패치 디렉터리를 통째로 지운다.
      # 상성 코치가 쓰는 사실 카드·위키 분류·통계·지식 번들도 그 안에 있으므로
      # 패치가 바뀌면 함께 다시 만들어야 한다. 안 그러면 코치가 404 로 죽는다.
      - name: Rebuild advisor data for new patch
        if: steps.patch.outputs.changed == 'true'
        run: |
          npm run llm:fetch-meta
          npm run llm:fetch-wiki
          npm run llm:fetch-wiki-items
          npm run llm:fetch-wiki-tips
          npm run llm:build
          npm run llm:fetch-rules
          npm run oracle:build
          npm run llm:matchup-list
          npm run llm:bundle

      # 패치가 그대로여도 통계는 계속 움직인다. 하루 한 번만 새로 받는다.
      # 회차마다 lol.ps 에 1,000건씩 보내지 않기 위해서다.
      - name: Refresh statistics daily
        if: needs.check.outputs.reason == 'stats' && steps.patch.outputs.changed != 'true'
        run: |
          npm run oracle:build -- --refresh
          npm run llm:bundle

      - name: Validate knowledge layer
        run: npm run llm:validate

      # 사실 카드와 통계는 자동으로 갱신되지만 사람이 쓴 지식 카드는 그대로 남는다.
      # 스킬이 바뀐 챔피언의 카드를 재검토 대상으로 올려 둔다. 빌드를 막지는 않는다.
      - name: Check knowledge drift
        if: steps.patch.outputs.changed == 'true'
        continue-on-error: true
        run: npm run llm:check-drift

      - name: Validate project
        run: |
          npm run type-check
          npm run lint
          npm test

      - name: Check for changes
        id: git-check
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all -- public/data)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated data locally
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/data/
          git commit -m "chore: update static data [skip ci]"

      - name: Build project
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        run: VITE_DEPLOYMENT_VERSION="$(git rev-parse --short=16 HEAD)" npm run build

      - name: Prepare GitHub Pages artifact
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        run: npm run prepare-pages

      - name: Verify deployment artifact
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        run: |
          test -f dist/.nojekyll
          test -f dist/404.html
          test -f dist/encyclopedia/index.html
          test -f dist/simulation/index.html
          diff --recursive --brief public/data dist/data

      - name: Install Playwright browser
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        run: npm run test:e2e

      - name: Push validated generated data
        if: steps.git-check.outputs.changed == 'true'
        run: git push

      - name: Deploy to GitHub Pages
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
