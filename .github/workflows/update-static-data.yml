name: Update Static Data

on:
  schedule:
    # 30분마다 실행 (UTC 기준)
    - cron: '*/30 * * * *'
  workflow_dispatch: # 수동 실행 가능
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: update-static-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Read current patch
        id: before
        run: echo "patch=$(node -p "require('./public/data/version.json').patchVersion")" >> "$GITHUB_OUTPUT"

      - name: Generate static data
        run: npm run generate-static-data

      - name: Detect patch change
        id: patch
        run: |
          after="$(node -p "require('./public/data/version.json').patchVersion")"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          if [[ "$after" != "${{ steps.before.outputs.patch }}" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # generate-static-data 는 이전 패치 디렉터리를 통째로 지운다.
      # 상성 코치가 쓰는 사실 카드·위키 분류·통계·지식 번들도 그 안에 있으므로
      # 패치가 바뀌면 함께 다시 만들어야 한다. 안 그러면 코치가 404 로 죽는다.
      - name: Rebuild advisor data for new patch
        if: steps.patch.outputs.changed == 'true'
        run: |
          npm run llm:fetch-meta
          npm run llm:fetch-wiki
          npm run llm:fetch-wiki-items
          npm run llm:fetch-wiki-tips
          npm run llm:build
          npm run llm:fetch-rules
          npm run oracle:build
          npm run llm:matchup-list
          npm run llm:bundle

      # 패치가 그대로여도 통계는 계속 움직인다. 하루 한 번만 새로 받는다.
      # 30분마다 lol.ps 에 1,000건씩 보내지 않기 위해서다.
      - name: Refresh statistics daily
        if: steps.patch.outputs.changed != 'true' && github.event_name == 'schedule'
        run: |
          if [[ "$(date -u +%H)" == "00" && "$(date -u +%M)" -lt 30 ]]; then
            npm run oracle:build -- --refresh
            npm run llm:bundle
          else
            echo "통계 갱신은 UTC 00시 회차에서만 한다. 이번 회차는 건너뛴다."
          fi

      - name: Validate knowledge layer
        run: npm run llm:validate

      # 사실 카드와 통계는 자동으로 갱신되지만 사람이 쓴 지식 카드는 그대로 남는다.
      # 스킬이 바뀐 챔피언의 카드를 재검토 대상으로 올려 둔다. 빌드를 막지는 않는다.
      - name: Check knowledge drift
        if: steps.patch.outputs.changed == 'true'
        continue-on-error: true
        run: npm run llm:check-drift

      - name: Validate project
        run: |
          npm run type-check
          npm run lint
          npm test

      - name: Check for changes
        id: git-check
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all -- public/data)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated data locally
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/data/
          git commit -m "chore: update static data [skip ci]"

      - name: Build project
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        run: VITE_DEPLOYMENT_VERSION="$(git rev-parse --short=16 HEAD)" npm run build

      - name: Prepare GitHub Pages artifact
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        run: npm run prepare-pages

      - name: Verify deployment artifact
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        run: |
          test -f dist/.nojekyll
          test -f dist/404.html
          test -f dist/encyclopedia/index.html
          test -f dist/simulation/index.html
          diff --recursive --brief public/data dist/data

      - name: Install Playwright browser
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        run: npm run test:e2e

      - name: Push validated generated data
        if: steps.git-check.outputs.changed == 'true'
        run: git push

      - name: Deploy to GitHub Pages
        if: github.event_name != 'schedule' || steps.git-check.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
