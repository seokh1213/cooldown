name: Watch Game Knowledge

on:
  schedule:
    - cron: '37 0 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Update Static Data']
    types: [completed]
    branches: [master]

permissions:
  contents: read
  actions: read

jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.trigger.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          sparse-checkout: scripts/ci
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check whether static data was generated
        id: trigger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/ci/game-knowledge-trigger.mjs

  watch:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 원천을 수집하지 않는 후속 회차가 대기 중인 실제 검수를 취소하지 않게 한다.
    concurrency:
      group: watch-game-knowledge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          sparse-checkout: '/*'
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Compare wiki, official notes and CDragon
        run: npm run llm:watch-game-knowledge
      - name: Preserve report and collected sources
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-knowledge-source-check
          path: research/.cache/game-knowledge/watch/
          retention-days: 14
          if-no-files-found: warn
