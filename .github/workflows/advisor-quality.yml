name: Advisor Regression

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: advisor-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare the same advisor data used for deployment
        run: npm run check:release -- --phase prepare

      - name: Compare advisor regression baseline
        run: npm run llm:test -- --profile regression --baseline dev/research/llm-evals/workflow/reports/regression/baseline.json --out dev/research/.cache/quality/ci

      - name: Check reviewed ability ticks against all shipped locales
        run: npm run llm:ticks:audit

      - name: Upload regression and semantic review packet
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: advisor-regression
          path: dev/research/.cache/quality/ci
          retention-days: 14
          if-no-files-found: ignore
